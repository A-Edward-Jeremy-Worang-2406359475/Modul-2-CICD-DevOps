<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Detail Form</title>
</head>
<body>
<h1>Find Payment Detail</h1>
<form method="get" onsubmit="this.action='/payment/detail/' + document.getElementById('paymentId').value;">
    <label for="paymentId">Payment ID:</label>
    <input type="text" id="paymentId" name="paymentId"/>
    <button type="submit">Search</button>
</form>
</body>
</html>
