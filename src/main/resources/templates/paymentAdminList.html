<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Payment List</title>
</head>
<body>
<h1>All Payments</h1>

<table border="1">
    <tr>
        <th>Payment ID</th>
        <th>Method</th>
        <th>Status</th>
    </tr>
    <tr th:each="payment : ${payments}">
        <td>
            <a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}" th:text="${payment.id}"></a>
        </td>
        <td th:text="${payment.method}"></td>
        <td th:text="${payment.status}"></td>
    </tr>
</table>
</body>
</html>
