<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pay Order</title>
</head>
<body>
<h1>Pay Order</h1>
<p th:text="'Order ID: ' + ${orderId}"></p>

<form th:action="@{/order/pay/{id}(id=${orderId})}" method="post">
    <label for="method">Payment Method:</label>
    <select id="method" name="method">
        <option value="Voucher Code">Voucher Code</option>
        <option value="Cash on Delivery">Cash on Delivery</option>
    </select>

    <h3>Voucher Code</h3>
    <label for="voucherCode">Voucher Code:</label>
    <input type="text" id="voucherCode" name="voucherCode"/>

    <h3>Cash on Delivery</h3>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address"/>

    <label for="deliveryFee">Delivery Fee:</label>
    <input type="text" id="deliveryFee" name="deliveryFee"/>

    <button type="submit">Pay</button>
</form>
</body>
</html>
